<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Selected ad copy, polished for the portfolio</title>
  <desc id="desc">Two anonymized adaptations: One rooftop. More possibility. Your next step starts with a conversation. Original Campaign 15 reported 66 link clicks on 19 dollars 88 cents, at 30 cents per click. Original Campaign 17 reported 90 link clicks on 34 dollars 92 cents, at 39 cents per click. These polished adaptations have not been run as ads.</desc>
  <rect width="1200" height="860" fill="#12252d"/>
  <path d="M62 60H1138" stroke="#48606a"/>
  <text x="64" y="103" fill="#d8bd8d" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">SELECTED COPY</text>
  <text x="1136" y="103" text-anchor="end" fill="#aabcc2" font-family="Arial,sans-serif" font-size="16">PORTFOLIO ADAPTATIONS</text>
  <text x="59" y="205" fill="#d8bd8d" font-family="Georgia,serif" font-size="100">“</text>
  <text x="115" y="210" fill="#f3ede2" font-family="Georgia,serif" font-size="62">One rooftop.</text>
  <text x="115" y="284" fill="#f3ede2" font-family="Georgia,serif" font-size="62" font-style="italic">More possibility.</text>
  <text x="117" y="331" fill="#aabcc2" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">PROJECT STORY · CAMPAIGN 15</text>
  <text x="117" y="381" fill="#f3ede2" font-family="Arial,sans-serif" font-size="21">66 link clicks</text>
  <text x="406" y="381" fill="#f3ede2" font-family="Arial,sans-serif" font-size="21">$19.88 spend</text>
  <text x="718" y="381" fill="#d8bd8d" font-family="Arial,sans-serif" font-size="21">$0.30 per link click</text>
  <path d="M64 425H1136" stroke="#48606a"/>
  <text x="59" y="526" fill="#d8bd8d" font-family="Georgia,serif" font-size="100">“</text>
  <text x="115" y="531" fill="#f3ede2" font-family="Georgia,serif" font-size="56">Your next step starts</text>
  <text x="115" y="600" fill="#f3ede2" font-family="Georgia,serif" font-size="56" font-style="italic">with a conversation.</text>
  <text x="117" y="647" fill="#aabcc2" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">DIRECT SERVICE OFFER · CAMPAIGN 17</text>
  <text x="117" y="697" fill="#f3ede2" font-family="Arial,sans-serif" font-size="21">90 link clicks</text>
  <text x="406" y="697" fill="#f3ede2" font-family="Arial,sans-serif" font-size="21">$34.92 spend</text>
  <text x="718" y="697" fill="#d8bd8d" font-family="Arial,sans-serif" font-size="21">$0.39 per link click</text>
  <path d="M64 741H1136" stroke="#48606a"/>
  <text x="64" y="784" fill="#aabcc2" font-family="Arial,sans-serif" font-size="17">Metrics belong to the original campaigns. Polished adaptations have not been run as ads.</text>
  <text x="64" y="816" fill="#aabcc2" font-family="Arial,sans-serif" font-size="15">Amounts in USD. Company identities and original ad images are excluded.</text>
</svg>
